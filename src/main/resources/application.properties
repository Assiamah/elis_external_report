spring.application.name=elis

server.port=9009
spring.profiles.active=dev

# Spring multipart configuration (global defaults)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=2MB
spring.servlet.multipart.location=${java.io.tmpdir}

# Tomcat multipart limits (fixes FileCountLimitExceededException)
server.tomcat.max-part-count=100 
server.tomcat.max-file-count=50 

# Other Tomcat limits (keep if handling large uploads)
server.tomcat.max-swallow-size=100MB
server.tomcat.max-http-post-size=100MB

spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp